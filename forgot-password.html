<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Reset your Knot password">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%232A4BD7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg>">
<title>Knot — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="/api/toastsystem.js"></script>
<style>
  :root{
    --bg: #F7F8FB;
    --bg-2: #FFFFFF;
    --bg-3: #EEF1F6;
    --ink: #151922;
    --muted: #5B6472;
    --muted-2: #8890A0;
    --blue: #2A4BD7;
    --blue-bright: #1B37AE;
    --blue-soft: #EAEFFF;
    --red: #C4432A;
    --line: rgba(21,25,34,0.10);
    --line-strong: rgba(21,25,34,0.18);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1,h2,h3{
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
  }
  a{ color: inherit; text-decoration: none; }

  ::selection{ background: var(--blue); color: #fff; }

  :focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 3px;
    border-radius: 4px;
  }

  nav{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    z-index: 100;
  }
  .nav-inner{
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
  }
  .logo-mark{
    width: 20px;
    height: 20px;
  }
  .nav-links{
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .text-link{
    font-size: 14px;
    color: var(--muted);
    transition: color 0.2s ease;
  }
  .text-link:hover{
    color: var(--ink);
  }

  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Work Sans', sans-serif;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }
  .btn:disabled{
    opacity: 0.6;
    cursor: not-allowed;
  }
  .btn-primary{
    background: var(--blue);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled){
    background: var(--blue-bright);
  }
  .btn-ghost{
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .btn-ghost:hover:not(:disabled){
    background: var(--bg-3);
  }

  .reset-page{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 40px;
  }
  .reset-container{
    width: 100%;
    max-width: 420px;
  }
  .reset-header{
    text-align: center;
    margin-bottom: 32px;
  }
  .reset-header h1{
    font-size: 36px;
    margin-bottom: 12px;
  }
  .reset-header p{
    color: var(--muted);
    font-size: 15px;
  }

  .form-group{
    margin-bottom: 20px;
  }
  .form-label{
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .form-input{
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    font-size: 15px;
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    background: var(--bg-2);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .form-input:focus{
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .form-input::placeholder{
    color: var(--muted-2);
  }
  .form-actions{
    margin-top: 24px;
  }
  .form-actions .btn{
    width: 100%;
  }

  .success{
    background: #d4edda;
    border: 1px solid #c3e6cb;
    color: #155724;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .error{
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    color: #721c24;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 24px;
  }

  @media (max-width: 640px){
    .reset-page{
      padding: 100px 20px 40px;
    }
    .reset-header h1{
      font-size: 28px;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <i data-lucide="link" class="logo-mark" style="color: #2A4BD7;"></i>
      Knot
    </div>
    <div class="nav-links">
      <a class="text-link" href="login.html">Back to login</a>
    </div>
  </div>
</nav>

<div class="reset-page">
  <div class="reset-container">
    <div class="reset-header">
      <h1>Reset your password</h1>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
      <p style="font-size: 13px; color: var(--muted-2); margin-top: 8px;">Look out for an email from <strong>Supabase Auth</strong> or <strong>noreply@mail.app.supabase.io</strong></p>
    </div>

    <div id="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="resetBtn">Send reset link</button>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function(){
    var SupabaseClient = null;

    function getSupabaseClient(){
      if(SupabaseClient) return SupabaseClient;
      
      try{
        if(typeof supabase === 'undefined'){
          throw new Error('Supabase not loaded');
        }
        SupabaseClient = supabase.createClient(
          'https://mfjtdrqvmuwtoarkiezi.supabase.co',
          'sb_publishable_SPhsUI31nYbrrLjPBAaRBw_OkWQ2_Xn'
        );
        return SupabaseClient;
      }catch(err){
        console.error('Failed to initialize Supabase:', err);
        return null;
      }
    }

    function setButtonLoading(btn, isLoading){
      if(isLoading){
        btn.disabled = true;
        btn.dataset.originalText = btn.textContent;
        btn.textContent = 'Sending...';
      }else{
        btn.disabled = false;
        btn.textContent = btn.dataset.originalText || btn.textContent;
      }
    }

    // Initialize Toast System
    if(typeof ToastSystem !== 'undefined'){
      ToastSystem.init('forgot-password.html');
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e){
      e.preventDefault();
      
      var email = document.getElementById('email').value;
      var btn = document.getElementById('resetBtn');
      var messageDiv = document.getElementById('message');

      var client = getSupabaseClient();
      if(!client){
        messageDiv.innerHTML = '<div class="error">Authentication service unavailable. Please try again later.</div>';
        return;
      }

      setButtonLoading(btn, true);
      messageDiv.innerHTML = '';

      try{
        var { data, error } = await client.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password.html'
        });

        if(error) throw error;

        messageDiv.innerHTML = '<div class="success">If an account exists with this email, you will receive a password reset link shortly.</div>';
        document.getElementById('resetForm').style.display = 'none';
        
      }catch(err){
        console.error('Password reset error:', err);
        messageDiv.innerHTML = '<div class="error">Error: ' + err.message + '</div>';
        setButtonLoading(btn, false);
      }
    });

    // Initialize Lucide icons
    if(typeof lucide !== 'undefined'){
      lucide.createIcons();
    }
  });
</script>

</body>
</html>
