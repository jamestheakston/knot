<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue to Knot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f8fb;
      margin: 0;
      padding: 20px;
      color: #151922;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid rgba(21, 25, 34, 0.1);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(21, 25, 34, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #151922;
    }

    .subtitle {
      font-size: 14px;
      color: #5b6472;
      margin-bottom: 32px;
    }

    .button {
      display: inline-block;
      background-color: #2a4bd7;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 12px;
    }

    .button:hover {
      background-color: #1b37ae;
    }

    .button.secondary {
      background-color: #f7f8fb;
      color: #151922;
      border: 1px solid rgba(21, 25, 34, 0.1);
    }

    .button.secondary:hover {
      background-color: #eef1f6;
    }

    .divider {
      border-top: 1px solid rgba(21, 25, 34, 0.1);
      margin: 24px 0;
    }

    .info {
      font-size: 13px;
      color: #8890a0;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign in to continue</h1>
    <p class="subtitle">You need to be logged in to access this page</p>

    <button class="button" onclick="signIn()">Sign In</button>
    <button class="button secondary" onclick="window.location.href='https://knotapp.pages.dev/index.html'">Go to Homepage</button>

    <div class="divider"></div>

    <p class="info">After signing in, you'll be redirected to your destination</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var supabaseUrl = 'https://mfjtdrqvmuwtoarkiezi.supabase.co';
    var supabaseKey = 'sb_publishable_SPhsUI31nYbrrLjPBAaRBw_OkWQ2_Xn';
    var supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Get redirect URL from query parameter
    var urlParams = new URLSearchParams(window.location.search);
    var redirectUrl = urlParams.get('redirect') || 'https://knotapp.pages.dev/dashboard.html';

    // Check if user is already logged in
    supabase.auth.getUser().then(function({ data: { user }, error }) {
      if (user && !error) {
        // Already logged in, redirect
        window.location.href = redirectUrl;
      }
    });

    function signIn() {
      // Redirect to login page with redirect parameter
      window.location.href = 'https://knotapp.pages.dev/login.html?redirect=' + encodeURIComponent(redirectUrl);
    }
  </script>
</body>
</html>
