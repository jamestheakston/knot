<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1rem;min-height:320px;">

  <div id="spinner-state" style="display:flex;flex-direction:column;align-items:center;">
    <svg width="40" height="40" viewBox="0 0 40 40" style="animation:spin 0.9s linear infinite;">
      <circle cx="20" cy="20" r="16" fill="none" stroke="var(--border-strong)" stroke-width="3"></circle>
      <circle cx="20" cy="20" r="16" fill="none" stroke="var(--text-accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 100"></circle>
    </svg>
    <p style="margin-top:1.5rem;font-size:16px;font-weight:500;color:var(--text-primary);">We're getting ready to process your transaction</p>
    <p style="margin-top:0.5rem;font-size:14px;color:var(--text-secondary);">Please don't close this page</p>
  </div>

  <div id="error-state" style="display:none;flex-direction:column;align-items:center;max-width:420px;">
    <div style="width:44px;height:44px;border-radius:50%;background:var(--bg-danger);display:flex;align-items:center;justify-content:center;">
      <i class="ti ti-alert-triangle" style="font-size:22px;color:var(--text-danger);" aria-hidden="true"></i>
    </div>
    <p style="margin-top:1.25rem;font-size:16px;font-weight:500;color:var(--text-primary);">We couldn't open checkout</p>
    <p style="margin-top:0.5rem;font-size:14px;color:var(--text-secondary);line-height:1.6;">
      Please try again in a moment. If the problem continues, contact
      <a href="mailto:jamesttheakston2@gmail.com" style="color:var(--text-accent);">jamesttheakston2@gmail.com</a>
      and we'll upgrade your account manually.
    </p>
    <button style="margin-top:1.5rem;">
      <i class="ti ti-refresh" style="font-size:16px;vertical-align:-2px;margin-right:6px;" aria-hidden="true"></i>Try again
    </button>
  </div>

</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
setTimeout(function() {
  document.getElementById('spinner-state').style.display = 'none';
  document.getElementById('error-state').style.display = 'flex';
}, 3000);
</script>
