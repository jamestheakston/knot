<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white flex items-center justify-center min-h-screen text-slate-900">

    <div id="app" class="max-w-sm w-full p-6 text-center transition-all duration-700 ease-in-out opacity-100">
        
        <!-- Loading State -->
        <div id="loading-view" class="space-y-6">
            <div class="flex justify-center">
                <i data-lucide="loader-2" class="w-8 h-8 text-slate-400 animate-spin"></i>
            </div>
            <div class="space-y-1">
                <h2 class="text-lg font-medium text-slate-900">Preparing your checkout</h2>
                <p class="text-slate-500 text-sm">Please don't close this page.</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-view" class="hidden space-y-6">
            <div class="flex justify-center">
                <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center">
                    <i data-lucide="alert-circle" class="w-6 h-6 text-slate-600"></i>
                </div>
            </div>
            <div class="space-y-2">
                <h2 class="text-lg font-medium text-slate-900">We couldn't open checkout</h2>
                <p class="text-slate-500 text-sm leading-relaxed">
                    Please try again in a moment. If the problem continues, contact 
                    <a href="mailto:jamesttheakston2@gmail.com" class="text-slate-900 hover:text-black transition-colors underline font-medium">jamesttheakston2@gmail.com</a> 
                    and we'll upgrade your account manually.
                </p>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            lucide.createIcons();

            const loadingView = document.getElementById('loading-view');
            const errorView = document.getElementById('error-view');
            const app = document.getElementById('app');

            // Timer logic to switch states
            setTimeout(() => {
                app.classList.add('opacity-0');
                
                setTimeout(() => {
                    loadingView.classList.add('hidden');
                    errorView.classList.remove('hidden');
                    app.classList.remove('opacity-0');
                }, 600);
            }, 3000);
        };
    </script>
</body>
</html>
